name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smart-contracts:
    name: 🛡️ Smart Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Dependencies
        working-directory: smart-contract
        run: |
          forge install foundry-rs/forge-std@v1.9.5 OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-commit || true

      - name: Build Contracts
        working-directory: smart-contract
        run: forge build --sizes

      - name: Run Test Suite
        working-directory: smart-contract
        run: forge test -vvv

  backend:
    name: ⚙️ Backend API (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Copy Env Example
        working-directory: backend
        run: cp .env.example .env

      - name: Install Dependencies
        working-directory: backend
        run: pnpm install --no-frozen-lockfile

      - name: Build API
        working-directory: backend
        run: pnpm build:api

  frontend:
    name: 🎨 Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Copy Env Example
        working-directory: frontend
        run: cp .env.local.example .env.local

      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js App
        working-directory: frontend
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: "cm1234567890privytest"
        run: pnpm build
